<!doctype html>
<html lang="zh-CN" data-line="{{ line.key }}" data-name="{{ line.name }}" data-prefix="{{ line.prefix }}" data-phased="{{ 1 if line.phased else 0 }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#122a32">
  <title>项目概览 · {{ line.name }}</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='8' fill='%231a7865'/%3E%3Cg fill='none' stroke='white' stroke-width='3.2' stroke-linecap='square'%3E%3Cpath d='M9 29V16l6-5v13zM18 29V16l6-5v13zM27 29V16l5-4v12z'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/app.css">
  <script type="module" src="/static/app.js"></script>
</head>
<body>
  <a class="skip" href="#main">跳到正文</a>
  <aside class="sidebar" id="sidebar" aria-label="项目导航">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
      <div><strong>OPL 工作台</strong><small>现场问题管理</small></div>
      <button class="icon-btn mobile-close" data-app="menu" aria-label="收起导航" title="收起导航"><span data-icon="x"></span></button>
    </div>
    <div class="project-sign"><span class="line-mark" aria-hidden="true"><span data-icon="production"></span></span><div><b>{{ line.name }}</b><small>ZF Saarbrücken</small></div></div>
    <nav>
      <a href="#overview" data-nav="overview"><span data-icon="dashboard"></span>项目概览</a>
      <a href="#issues" data-nav="issues"><span data-icon="rows"></span>问题清单</a>
      <a href="#tasks" data-nav="tasks"><span data-icon="checklist"></span>专项任务</a>
      <a href="#report" data-nav="report"><span data-icon="report"></span>项目周报</a>
      <div class="nav-divider"></div>
      <a href="#imports" data-nav="imports"><span data-icon="import"></span>导入与核对</a>
    </nav>
    <div class="side-bottom"><span class="local-dot"></span>本地工作区</div>
  </aside>
  <button class="nav-shade" data-app="menu" aria-label="收起导航"></button>
  <div class="workspace">
    <header class="topbar">
      <div class="trail"><button class="icon-btn mobile-menu" data-app="menu" aria-label="展开导航"><span data-icon="menu"></span></button><select id="line-switch" aria-label="切换线体">{% for choice in lines %}<option data-line="{{ choice.key }}" value="{{ choice.prefix }}/"{% if choice == line %} selected{% endif %}>{{ choice.name }}</option>{% endfor %}</select><span class="crumb-sep">/</span><b id="crumb">项目概览</b></div>
      <button id="operator" class="operator" data-app="actor" title="设置现场操作人"><span data-icon="user"></span><span id="operator-name">设置操作人</span></button>
    </header>
    <main id="main" tabindex="-1" aria-live="polite">
      <div class="loading"><span></span>正在读取项目数据…</div>
    </main>
  </div>
  <dialog id="detail-dialog" class="dialog drawer" aria-labelledby="detail-title"><div class="dialog-frame"></div></dialog>
  <dialog id="edit-dialog" class="dialog" aria-labelledby="edit-title"><div class="dialog-frame"></div></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
